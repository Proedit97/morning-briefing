name: Keep every article

# After each new edition: list every edition in data/index.json and rebuild data/archive/ (all articles, by month).
on:
  push:
    branches: [main]
    paths:
      - "data/*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index and archive
        run: python3 tools/build_archive.py
      - name: Commit if changed
        run: |
          git config user.name "briefing-archive"
          git config user.email "briefing-archive@users.noreply.github.com"
          git add data/index.json data/archive
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "기사 모음 갱신"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
