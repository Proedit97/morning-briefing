name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and sync web app into Android
        run: |
          npm ci
          npx cap sync android

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../morning-briefing.apk

      - uses: actions/upload-artifact@v4
        with:
          name: morning-briefing-apk
          path: morning-briefing.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 아침 브리핑 1.0.${{ github.run_number }}
          make_latest: true
          files: morning-briefing.apk
          body: |
            휴대폰에서 아래 morning-briefing.apk 를 눌러 내려받고 설치하세요.
            처음 설치할 때 "출처를 알 수 없는 앱 설치"를 허용해야 해요.
